name: nutripump_mobile
description: NutriPump Artisanal — Premium Kashmiri products, now on mobile.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ──────────────────────────────────────────────
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  firebase_messaging: ^15.2.5
  firebase_crashlytics: ^4.3.0
  firebase_analytics: ^11.4.0

  # ── State & Navigation ────────────────────────────────────
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.5.0
  go_router: ^14.2.0

  # ── Auth ──────────────────────────────────────────────────
  google_sign_in: ^6.2.0

  # ── Payments ──────────────────────────────────────────────
  razorpay_flutter: ^1.4.5

  # ── Networking ────────────────────────────────────────────
  dio: ^5.7.0

  # ── Local Storage ─────────────────────────────────────────
  hive_flutter: ^1.1.0

  # ── UI & Animations ───────────────────────────────────────
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  lottie: ^3.0.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0

  # ── Forms ─────────────────────────────────────────────────
  reactive_forms: ^17.0.0

  # ── Utilities ─────────────────────────────────────────────
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^13.1.0
  image_picker: ^1.0.0
  app_links: ^6.1.0
  uuid: ^4.5.3
  flutter_animate: ^4.5.2
  speech_to_text: ^7.0.0
  permission_handler: ^12.0.1
  http: ^1.6.0
  flutter_local_notifications: ^18.0.1
  timeago: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.5.0
  build_runner: ^2.4.0
  mockito: ^5.4.4
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.0
  flutter_native_splash: ^2.3.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/nutripumplogo.webp"
  min_sdk_android: 21
  web:
    generate: false

flutter_native_splash:
  color: "#F8F7F6"
  image: assets/images/nutripumplogo.webp
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - .env
